type: object
properties:
  id:
    type: string
    format: ObjectId
    externalDocs:
      description: Unique identifier
      url: '/#section/Introduction/Unique-Identifier'
  createdAt:
    description: Date, iso 8601 format
    type: string
  updatedAt:
    description: Date, iso 8601 format. Sent back when publishing the Draft.
    type: string
  lastEditedBy:
    type: object
    description: The authenticator that last edited the Draft.
    properties:
      id:
        type: string
        format: ObjectId
        description: Id of the authenticator
      type:
        type: string
        enum:
        - Member
        - ApiKey
        - Service
  formula:
    type: string
    enum:
    - probabilistic
  riskFactors:
    type: array
    items:
      type: object
      properties:
        groupId:
          type: string
          format: ObjectId
        points:
          type: number
  riskClasses:
    type: array
    items:
      type: object
      properties:
        id:
          type: string
          format: ObjectId
        name:
          type: string
        min:
          type: integer
          description: Between 0 and 100
        max:
          type: integer
          description: Between 0 and 100
